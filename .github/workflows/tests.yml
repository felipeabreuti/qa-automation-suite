name: QA Automation Suite

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests-api/package-lock.json

      - name: Install dependencies
        run: cd tests-api && npm ci

      - name: Run API tests
        run: cd tests-api && npx playwright test

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-playwright-report
          path: tests-api/playwright-report

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests-e2e/package-lock.json

      - name: Install dependencies
        run: cd tests-e2e && npm ci

      - name: Install Playwright browsers
        run: cd tests-e2e && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd tests-e2e && npx playwright test

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-report
          path: tests-e2e/playwright-report
