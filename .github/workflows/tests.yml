name: QA Automation Suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests-api/package-lock.json

      - name: Install dependencies
        run: cd tests-api && npm ci

      - name: Run API tests
        run: cd tests-api && npx playwright test

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-playwright-report
          path: tests-api/playwright-report

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests-e2e/package-lock.json

      - name: Install dependencies
        run: cd tests-e2e && npm ci

      - name: Install Playwright browsers
        run: cd tests-e2e && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd tests-e2e && npx playwright test

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-report
          path: tests-e2e/playwright-report

  mobile:
    runs-on: ubuntu-latest
    # Consome minutos do plano BrowserStack: só em PR do próprio repo ou disparo manual; forks não recebem secrets
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: browserstack-mobile
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests-app/requirements.txt

      - name: Install dependencies
        run: cd tests-app && pip install -r requirements.txt

      - name: Run mobile tests
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_URL: ${{ secrets.BROWSERSTACK_APP_URL }}
        run: cd tests-app && pytest

      - name: Upload mobile report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-pytest-report
          path: tests-app/report